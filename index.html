<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confident Onboarding Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#1C1739;
  --blue:#5237E9;
  --cyan:#5CCEFF;
  --coral:#F36344;
  --gray:#F3F3F3;
  --white:#FFFFFF;
  --ink:#1A1A2E;

  --purple-soft:rgba(28,23,57,.06);
  --blue-soft:rgba(82,55,233,.08);
  --cyan-soft:rgba(92,206,255,.16);
  --coral-soft:rgba(243,99,68,.10);
  --line:rgba(28,23,57,.10);

  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --shadow:0 1px 2px rgba(28,23,57,.04), 0 8px 24px rgba(28,23,57,.06);
  --font:"Work Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  color:var(--ink);
  background:var(--white);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:700;color:var(--purple);letter-spacing:-.015em}
h1{font-size:30px;line-height:1.2}
h2{font-size:22px;line-height:1.25}
h3{font-size:17px;line-height:1.3;font-weight:600}
p{margin:0}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}

.overline{
  font-family:var(--mono);font-size:11px;font-weight:500;
  letter-spacing:.10em;text-transform:uppercase;color:rgba(28,23,57,.55);
}
.mono{font-family:var(--mono)}
.muted{color:rgba(28,23,57,.60)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- app shell ---------- */
.topbar{
  background:var(--purple);color:var(--white);
  padding:14px 28px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;
}
.topbar .logo{height:26px;width:auto;display:block;flex-shrink:0}
.topbar .spacer{flex:1}
.resetbtn{
  font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.20);
  border-radius:var(--r-pill);padding:5px 12px;transition:.15s;
}
.resetbtn:hover{color:var(--white);border-color:rgba(255,255,255,.45)}
.switcher{
  display:flex;background:rgba(255,255,255,.10);border-radius:var(--r-pill);padding:3px;gap:2px;
}
.switcher button{
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(255,255,255,.72);padding:7px 16px;border-radius:var(--r-pill);transition:.15s;
}
.switcher button:hover{color:var(--white)}
.switcher button[aria-pressed="true"]{background:var(--white);color:var(--purple)}
.draftflag{
  font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--cyan);border:1px solid rgba(92,206,255,.45);border-radius:var(--r-pill);padding:4px 11px;
}
.page{max-width:1240px;margin:0 auto;padding:40px 28px 96px}

/* ---------- lab hero ---------- */
.hero{
  background:var(--purple);color:var(--white);border-radius:var(--r-lg);
  padding:36px 40px;margin-bottom:32px;position:relative;overflow:hidden;
}
.hero:after{
  content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;
  border-radius:50%;background:rgba(92,206,255,.10);
}
.hero h1{color:var(--white);margin-bottom:6px}
.hero .sub{color:rgba(255,255,255,.72);font-size:15px}
.hero-grid{display:flex;gap:44px;align-items:flex-start;flex-wrap:wrap;position:relative;z-index:1}
.hero-left{flex:1;min-width:300px}
.progress-wrap{margin-top:26px;max-width:520px}
.progress-line{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.progress-count{font-family:var(--mono);font-size:13px;color:var(--cyan);letter-spacing:.04em}
.bar{height:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.16);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:var(--r-pill);background:var(--cyan);transition:width .3s}

.nextcard{
  background:var(--white);border-radius:var(--r-md);padding:22px 24px;
  min-width:310px;max-width:380px;box-shadow:var(--shadow);
}
.nextcard .overline{color:var(--coral)}
.nextcard h3{margin:8px 0 6px}
.nextcard p{font-size:14px;color:rgba(28,23,57,.68)}
.btn-coral{
  display:inline-block;margin-top:16px;background:var(--coral);color:var(--white);
  font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;
  padding:11px 20px;border-radius:var(--r-pill);
}
.btn-coral:hover{filter:brightness(.95)}

/* ---------- layout ---------- */
.cols{display:flex;gap:32px;align-items:flex-start}
.main{flex:1;min-width:0}
.rail{width:320px;flex-shrink:0}
@media(max-width:1000px){.cols{flex-direction:column}.rail{width:100%}}

.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}

.btn-ghost{
  border:1px solid var(--line);border-radius:var(--r-pill);padding:9px 16px;
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;
  color:var(--purple);background:var(--white);transition:.15s;
}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-blue{
  background:var(--blue);color:var(--white);border-radius:var(--r-pill);padding:10px 18px;
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;
}
.btn-blue:hover{filter:brightness(1.06)}

/* ---------- phases + tasks ---------- */
.phase{margin-bottom:26px;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--white)}
.phase-head{
  display:flex;align-items:center;gap:14px;padding:16px 20px;
  background:var(--gray);border-bottom:1px solid var(--line);
}
.phase-badge{
  font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;
  background:var(--cyan-soft);color:var(--purple);padding:5px 11px;border-radius:var(--r-pill);white-space:nowrap;
}
.phase-head h3{flex:1;min-width:0}
.phase-meter{display:flex;align-items:center;gap:10px}
.phase-meter .bar{width:82px;background:rgba(28,23,57,.10)}
.phase-meter .bar>span{background:var(--blue)}
.phase-meter .n{font-family:var(--mono);font-size:12px;color:rgba(28,23,57,.62)}

.task{border-bottom:1px solid var(--line);transition:background .15s}
.task:last-child{border-bottom:0}
.task:hover{background:rgba(82,55,233,.025)}
.task-row{display:flex;align-items:flex-start;gap:14px;padding:15px 20px}
.check{
  width:20px;height:20px;flex-shrink:0;margin-top:2px;border-radius:6px;
  border:1.5px solid rgba(28,23,57,.28);background:var(--white);
  display:grid;place-items:center;transition:.15s;
}
.check:hover{border-color:var(--blue)}
.check[data-done="1"]{background:var(--blue);border-color:var(--blue)}
.check svg{width:12px;height:12px;opacity:0}
.check[data-done="1"] svg{opacity:1}
.task-body{flex:1;min-width:0}
.task-title{font-size:15px;font-weight:500;color:var(--ink);display:block;text-align:left}
.task[data-done="1"] .task-title{color:rgba(28,23,57,.45);text-decoration:line-through}
.task-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px}
.chip{
  font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:var(--r-pill);white-space:nowrap;
}
.chip-lab{background:var(--cyan-soft);color:#0d5c80}
.chip-conf{background:var(--blue-soft);color:var(--blue)}
.chip-late{background:var(--coral-soft);color:#b8391f}
.chip-src{background:var(--purple-soft);color:rgba(28,23,57,.62)}
.task-date{font-family:var(--mono);font-size:11px;color:rgba(28,23,57,.50)}
.task-expand{padding:0 20px 20px 54px;display:none}
.task[data-open="1"] .task-expand{display:block}
.task-desc{font-size:14px;color:rgba(28,23,57,.72);margin-bottom:14px;max-width:64ch}
.attach{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.attach a{display:flex;align-items:center;gap:9px;font-size:13.5px}
.attach svg{width:14px;height:14px;flex-shrink:0;opacity:.8}
.comments{border-top:1px solid var(--line);padding-top:14px}
.comment{display:flex;gap:11px;margin-bottom:12px}
.avatar{
  width:28px;height:28px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;font-weight:500;color:var(--white);background:var(--blue);
}
.avatar.lab{background:var(--purple)}
.comment-b{flex:1;min-width:0}
.comment-who{font-size:13px;font-weight:600;color:var(--purple)}
.comment-when{font-family:var(--mono);font-size:10.5px;color:rgba(28,23,57,.45);margin-left:7px}
.comment-txt{font-size:13.5px;color:rgba(28,23,57,.75);margin-top:2px}
.comment-form{display:flex;gap:9px;margin-top:12px}
.comment-form input{
  flex:1;border:1px solid var(--line);border-radius:var(--r-pill);padding:9px 15px;background:var(--white);
}
.comment-form input:focus{outline:none;border-color:var(--blue)}

/* ---------- rail cards ---------- */
.card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--r-md);
  padding:22px;margin-bottom:20px;
}
.card.filled{background:var(--gray);border-color:transparent}
.card h3{margin-bottom:14px}
.card .overline{display:block;margin-bottom:12px}
.am{display:flex;align-items:center;gap:13px;margin-bottom:14px}
.am .avatar{width:44px;height:44px;font-size:13px}
.am-name{font-size:15px;font-weight:600;color:var(--purple)}
.linklist{display:flex;flex-direction:column;gap:11px}
.linklist a{font-size:13.5px;display:flex;gap:9px;align-items:flex-start}
.linklist svg{width:14px;height:14px;flex-shrink:0;margin-top:3px;opacity:.75}
.slug{font-family:var(--mono);font-size:11px;color:rgba(28,23,57,.45);display:block;margin-top:2px;word-break:break-all}
.contact{font-size:13.5px;margin-bottom:7px}

/* ---------- AM portfolio ---------- */
.stats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:30px}
.stat{
  flex:1;min-width:170px;border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;background:var(--white);
}
.stat .n{font-size:32px;font-weight:700;color:var(--purple);line-height:1.1;letter-spacing:-.02em}
.stat.alert .n{color:var(--coral)}
.stat .overline{margin-top:6px;display:block}
.tablewrap{border:1px solid var(--line);border-radius:var(--r-md);overflow-x:auto;background:var(--white)}
table{width:100%;border-collapse:collapse}
thead th{
  text-align:left;padding:13px 18px;background:var(--gray);border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;
  color:rgba(28,23,57,.58);white-space:nowrap;
}
tbody td{padding:15px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tbody td:first-child{vertical-align:top;padding-left:18px}
tbody td:last-child{padding-right:18px}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:rgba(82,55,233,.03)}
.labname{font-weight:600;color:var(--purple);font-size:14.5px}
.tier{font-family:var(--mono);font-size:11px;color:rgba(28,23,57,.60)}
.minibar{display:flex;align-items:center;gap:8px;min-width:0}
.minibar .bar{width:54px;flex:0 0 auto;background:rgba(28,23,57,.10)}
.minibar .bar>span{background:var(--blue)}
.minibar .n{font-family:var(--mono);font-size:11.5px;color:rgba(28,23,57,.62);white-space:nowrap}
tr[data-stalled="1"] .minibar .bar>span{background:var(--coral)}
.days{font-family:var(--mono);font-size:12.5px}
.days.over{color:var(--coral);font-weight:500}
.backlink{
  display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;
  font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);
}

/* ---------- v3 additions ---------- */
.headbtns{display:flex;gap:10px;align-items:center}
.headbtns .btn-ghost{text-decoration:none;display:inline-flex;align-items:center}

/* Phase header now carries the date and the overdue state. */
.phase-due{font-family:var(--mono);font-size:11px;color:rgba(28,23,57,.55);white-space:nowrap}
.phase-due.late{color:var(--coral)}
.phase[data-late="1"] .phase-badge{background:rgba(243,99,68,.12);color:var(--coral)}

/* Delete control on a task row — low contrast until the row is hovered. */
.task-del{
  flex:0 0 auto;align-self:flex-start;margin-left:8px;
  width:24px;height:24px;border:0;border-radius:6px;cursor:pointer;
  background:transparent;color:rgba(28,23,57,.28);font-size:17px;line-height:1;
  opacity:0;transition:opacity .12s,background .12s,color .12s;
}
.task:hover .task-del,.task-del:focus-visible{opacity:1}
.task-del:hover{background:rgba(243,99,68,.12);color:var(--coral)}

.chip-linear{background:rgba(82,55,233,.10);color:var(--blue)}
.linearbox{margin-top:14px}
.linearrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.linearrow a{display:inline-flex;align-items:center;gap:7px;font-size:13px;text-decoration:none}
.linearrow a svg{width:13px;height:13px;flex:0 0 auto}
.linearform{display:flex;gap:8px;margin-top:10px}
.linearform input{flex:1;min-width:0}
.helplink{font-size:13.5px}

/* Portfolio: the status note is a second line under the lab name, where it is
   readable at full row width rather than squeezed into a column of its own. */
.statusnote{
  display:block;margin-top:5px;font-size:12.5px;line-height:1.45;
  color:rgba(28,23,57,.62);
}
/* The Lab cell holds the name, the Linear link and the status note, so it takes the
   slack in the row. Without this the note wraps to one word per line. */
tbody td:first-child{min-width:200px}
.labname{display:inline}
/* The phase badge is the widest thing in its column; let it wrap rather than force
   the whole table wider than the main pane. */
td .phase-badge{white-space:normal;display:inline-block;max-width:140px}
/* Keep the overdue chip inside the cell: the phase name can be long, and the row is
   already carrying a Lab/Us chip beside it. */
/* Two short lines beat a truncated one: the phase name is the point of the chip. */
td .chip-late{
  display:block;margin-top:5px;max-width:185px;
  white-space:normal;line-height:1.5;
}
.linearicon{display:inline-flex;margin-left:7px;color:var(--blue);vertical-align:middle}
.linearicon svg{width:12px;height:12px}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{
  display:inline-block;padding:2px 7px;border-radius:5px;
  background:rgba(92,206,255,.16);color:#1b6a92;
  font-size:10.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;
}
.tagpick{display:flex;flex-wrap:wrap;gap:8px}
.tagopt{display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  padding:6px 10px;border:1px solid rgba(28,23,57,.14);border-radius:8px;font-size:12.5px}
.tagopt input{width:auto;flex:0 0 auto;margin:0}
.tagopt:has(input:checked){border-color:var(--blue);background:rgba(82,55,233,.06)}
select.sentiment{font-size:12.5px;padding:5px 8px;max-width:170px}
select.sentiment[data-v="rough"]{color:var(--coral)}

/* Phase rows in the template editor. */
.phrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.phrow .phnum{
  flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:var(--gray);
  font-family:var(--mono);font-size:11px;display:grid;place-items:center;color:rgba(28,23,57,.6);
}
.phrow input[data-k="name"]{flex:1;min-width:0}
.offlab{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:rgba(28,23,57,.6);white-space:nowrap}
.offlab input{width:62px;flex:0 0 auto}
.xbtn[disabled]{opacity:.3;cursor:not-allowed}
.taskrow{align-items:center;gap:10px}
.taskpick{display:flex;align-items:center;gap:9px;flex:1;min-width:0;cursor:pointer}
.taskrow select{flex:0 0 auto;max-width:170px;font-size:12px;padding:5px 8px}

/* ---------- activity + slack ---------- */
.feed{display:flex;flex-direction:column;gap:0}
.feed-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.feed-item:last-child{border-bottom:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);flex-shrink:0;margin-top:8px}
.dot.blue{background:var(--blue)} .dot.coral{background:var(--coral)}
.feed-txt{font-size:13.5px;color:rgba(28,23,57,.78);flex:1}
.feed-txt b{color:var(--purple);font-weight:600}
.feed-when{font-family:var(--mono);font-size:10.5px;color:rgba(28,23,57,.42);white-space:nowrap}
.slackmsg{
  background:var(--purple);border-radius:var(--r-md);padding:18px 20px;color:rgba(255,255,255,.86);font-size:13.5px;
}
.slackmsg .chan{font-family:var(--mono);font-size:11px;color:var(--cyan);margin-bottom:10px;display:block}
.slackmsg b{color:var(--white)}
.slackmsg .row{padding:7px 0;border-top:1px solid rgba(255,255,255,.10)}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(28,23,57,.42);display:none;
  place-items:center;padding:24px;z-index:50;
}
.scrim[data-open="1"]{display:grid}
.modal{
  background:var(--white);border-radius:var(--r-lg);padding:32px;width:100%;max-width:520px;
  box-shadow:0 24px 64px rgba(28,23,57,.24);
}
.modal h2{margin-bottom:6px}
.modal>p{font-size:14px;color:rgba(28,23,57,.65);margin-bottom:22px}
.field{margin-bottom:18px}
.field label{display:block;margin-bottom:7px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;background:var(--white);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue)}
.field textarea{min-height:82px;resize:vertical}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:26px}
.note{
  background:var(--cyan-soft);border-radius:var(--r-sm);padding:12px 14px;
  font-size:12.5px;color:#0d5c80;margin-bottom:22px;
}

/* ---------- v2: collapsible phases ---------- */
.phase-head{cursor:pointer;user-select:none}
.phase-caret{
  width:18px;height:18px;display:grid;place-items:center;flex:0 0 auto;
  color:rgba(28,23,57,.42);transition:transform .15s ease;
}
.phase[data-collapsed="1"] .phase-caret{transform:rotate(-90deg)}
.phase[data-collapsed="1"] .task{display:none}

/* ---------- v2: assignee control ---------- */
.assignrow{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
}
.assignrow label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(28,23,57,.5)}
.assignrow select{
  border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;
  background:var(--white);font-family:var(--font);font-size:13px;color:var(--ink);
}
.assignrow select:focus{outline:none;border-color:var(--blue)}

/* ---------- v2: internal notes ---------- */
.notesbox{
  width:100%;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:11px 13px;min-height:118px;resize:vertical;
  font-family:var(--font);font-size:13.5px;line-height:1.55;background:var(--white);color:var(--ink);
}
.notesbox:focus{outline:none;border-color:var(--blue)}
.savedflag{font-size:11px;color:rgba(28,23,57,.45);margin-top:8px;display:block}

/* ---------- v2: settings, templates, wide modals ---------- */
.modal-wide{max-width:760px}
.modal-scroll{max-height:60vh;overflow:auto;padding-right:8px;margin-right:-8px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.subhead{
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  color:rgba(28,23,57,.5);margin:24px 0 12px;padding-top:18px;border-top:1px solid var(--line);
}
.subhead.first{margin-top:0;padding-top:0;border-top:none}
.rowitem{
  display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);
}
.rowitem:last-child{border-bottom:none}
.rowitem .grow{flex:1;min-width:0}
.rowitem input[type=text]{
  width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 11px;
  font-family:var(--font);font-size:13.5px;background:var(--white);color:var(--ink);
}
.rowitem input:focus{outline:none;border-color:var(--blue)}
.xbtn{
  border:none;background:none;cursor:pointer;color:rgba(28,23,57,.4);
  font-size:17px;line-height:1;padding:4px 8px;border-radius:var(--r-sm);
}
.xbtn:hover{background:var(--coral-soft);color:var(--coral)}
.tmplcard{
  border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;
}
.tmplcard h4{font-size:14px;margin-bottom:3px}
.tmplcard p{font-size:12.5px;color:rgba(28,23,57,.6)}
.emptyhint{font-size:13px;color:rgba(28,23,57,.5);font-style:italic;padding:12px 0;display:block}
.donetable td{color:rgba(28,23,57,.62)}
.donetable .labname{color:var(--ink)}
</style>

<script>
/* =====================================================================
   Confident Onboarding Portal — first draft
   Single-file prototype. All state is in memory (no persistence).
   Seed content marked PLACEHOLDER is invented and must be replaced with
   the real Notion checklist rows (see Open Item #1 in the project outline).
   ===================================================================== */

const TODAY = new Date('2026-09-08T12:00:00Z');

/* ---------- Phase (outline §6) ----------
   These are the portal-wide defaults. v2 lets an account manager rename phases
   for one lab without touching the defaults, so nothing reads PHASES directly —
   every caller goes through phasesFor(lab), which layers lab.phaseNames on top. */
/* v3: a phase carries dueOffset — days from the lab's start date. A phase template
   owns an ordered copy of this list, and creating a lab snapshots the template's copy
   onto the lab, so editing a template later never reshapes a live onboarding. */
const PHASES = [
  {id:'p1', order:1, name:'Kickoff & Access',      blurb:'Get everyone into the system and aligned on scope.',              dueOffset:14},
  {id:'p2', order:2, name:'Lab Configuration',     blurb:'Tell us what you test and what you charge.',                      dueOffset:35},
  {id:'p3', order:3, name:'Data & Methods',        blurb:'Wire your instruments and compliance rules into Confident.',      dueOffset:60},
  {id:'p4', order:4, name:'Validation & Go-Live',  blurb:'Prove it works on real samples, then switch over.',               dueOffset:85}
];
const clonePhases = () => PHASES.map(p => ({...p}));

/* v3: the industry menu labs pick from. Rendered as chips beside the plan. */
const INDUSTRIES = ['Cannabis','Hemp','Environmental','Food & Beverage','Agriculture','Pharmaceutical','Psychedelics','Consumer Products'];

/* v3: handed to a lab once its checklist is finished. */
const SURVEY_URL = 'https://www.confidentlims.com/onboarding-survey';
const SUPPORT_EMAIL = 'support@confidentlims.com';

/* ---------- Document (outline §4/§6) — real filenames from Notion ---------- */
const DOCS = {
  guide:   {id:'d-guide',  title:'Confident Client Onboarding Guide 2.0', file:'Confident_Client_Onboarding_Guide_2.0_-_Generic.pdf', shared:true},
  metrc:   {id:'d-metrc',  title:'Confident Lab Metrc Training (v2)',     file:'Confident_Lab_Metrc_Training_(v2).pdf',              shared:true, tiers:['Premium']},
  planStarter: {id:'d-p1', title:'Starter Plan Overview',  file:'Confident_Starter_Plan.pdf',  tiers:['Starter']},
  planPro:     {id:'d-p2', title:'Pro Plan Overview',      file:'Confident_Pro_Plan.pdf',      tiers:['Pro']},
  planPremium: {id:'d-p3', title:'Premium Plan Overview',  file:'Confident_Premium_Plan.pdf',  tiers:['Premium']},
  planBasic:   {id:'d-p4', title:'Basic Plan Overview',    file:'Confident_Basic_Plan.pdf',    tiers:['Basic']},
  /* v3: the worked COA example a lab compares its own preferences against. */
  coaExample:  {id:'d-coa',  title:'Confident COA Template — worked example', file:'Confident_COA_Template_Example.pdf', shared:true}
};

/* ---------- HelpArticle (outline §5.5) — curated help-center links ---------- */
const H = (slugPath, title) => ({title, url:'https://help.confidentlims.com/for-labs/'+slugPath});
const HELP = {
  login:     H('logging-in',            'How to log in and reset your password'),
  users:     H('managing-users',         'Adding and managing lab users'),
  analytes:  H('analyte-lists',          'Building your analyte list'),
  panels:    H('test-panels',            'How test panels work in Confident'),
  pricing:   H('pricing-and-orders',     'Setting up pricing for client orders'),
  coa:       H('coa-templates',          'Customizing your COA template'),
  importers: H('csv-importers',          'Instrument exports and CSV importers'),
  limits:    H('compliance-limits',      'Compliance limits and state rules'),
  metrc:     H('metrc-integration',      'Connecting Metrc'),
  samples:   H('receiving-samples',      'Receiving and logging samples')
};

/* ---------- Template task set (outline §5.3) — PLACEHOLDER content ---------- */
const TEMPLATE_TASKS = [
  {t:'Attend the onboarding kickoff call',                 ph:'p1', side:'confident', desc:'Your account manager walks your team through the onboarding plan, timeline, and what we need from you. Roughly 45 minutes.', help:[]},
  {t:'Confirm your lab admin users and email addresses',   ph:'p1', side:'lab',       desc:'Send us the names and email addresses of everyone who needs an account, and flag who should have admin rights.', help:['users'], docs:['guide']},
  {t:'Log in to Confident and set your password',          ph:'p1', side:'lab',       desc:'You will get an invite email. Use the lab login link in the Lab Links panel if you need it again.', help:['login']},
  {t:'Review the Client Onboarding Guide 2.0',             ph:'p1', side:'lab',       desc:'Skim it once end to end. It explains the vocabulary the rest of these tasks assume.', help:[], docs:['guide']},
  {t:'Provision your lab tenant in Confident',             ph:'p1', side:'confident', desc:'We create your lab environment, apply your plan, and enable the modules included in your tier.', help:[]},

  {t:'Provide your analyte list',                          ph:'p2', side:'lab',       desc:'A spreadsheet of every analyte you report, with the exact names you want printed on the COA.', help:['analytes']},
  {t:'Provide your assay and test panel menu',             ph:'p2', side:'lab',       desc:'Which panels you sell, and which analytes belong to each. This drives ordering and COA layout.', help:['panels']},
  {t:'Provide your client-facing pricing sheet',           ph:'p2', side:'lab',       desc:'Per-panel and per-sample pricing, plus any rush or bundle pricing you want reflected in the order form.', help:['pricing']},
  {t:'Configure test panels in Confident',                 ph:'p2', side:'confident', desc:'We build your panels from the menu you sent and send back a preview for approval.', help:['panels']},
  {t:'Review the Confident COA template example',          ph:'p2', side:'lab',       desc:'A worked example of a finished COA, so you can see the layout and field placement before telling us what you want changed.', help:['coa'], docs:['coaExample']},
  {t:'Confirm your COA template preferences',              ph:'p2', side:'lab',       desc:'Logo, header, disclaimer text, which fields appear, and whether you want a client-facing summary page. Compare against the worked example above.', help:['coa'], docs:['coaExample']},

  {t:'Provide your instrument list and export formats',    ph:'p3', side:'lab',       desc:'Make, model, and software for each instrument, plus one sample export file per instrument.', help:['importers']},
  {t:'Upload sample instrument export files',             ph:'p3', side:'lab',       desc:'Raw exports, unedited. We use these to build the importers, so representative files matter more than clean ones.', help:['importers']},
  {t:'Build your CSV importer configurations',             ph:'p3', side:'confident', desc:'We map each export format to Confident analytes so results land in the right fields automatically.', help:['importers']},
  {t:'Provide LOD/LOQ values and method references',       ph:'p3', side:'lab',       desc:'Per analyte, per matrix if they differ. These print on the COA and drive pass/fail logic.', help:['limits']},
  {t:'Configure compliance limits and state rules',        ph:'p3', side:'confident', desc:'We load your state action limits and configure pass/fail thresholds for each panel.', help:['limits']},
  {t:'Provide Metrc credentials and license numbers',      ph:'p3', side:'lab',       desc:'Required only if you report to Metrc. Included in Premium onboarding.', help:['metrc'], docs:['metrc'], tiers:['Premium']},

  {t:'Run a parallel test batch in Confident',             ph:'p4', side:'lab',       desc:'Log a real batch in Confident alongside your current process and compare the output.', help:['samples']},
  {t:'Review and approve your COA output',                 ph:'p4', side:'lab',       desc:'Sign off on the generated COA, or send edits. We iterate until you are happy with it.', help:['coa']},
  {t:'Confirm go-live date and client communications',     ph:'p4', side:'confident', desc:'We agree a cutover date and help you draft the note that goes to your clients.', help:[]}
];

/* ---------- v2: Task Template library ----------
   A Task Template stores the task information — title, description, phase, which
   side owns it — so an account manager can drop a known task into any lab without
   retyping it. Seeded from the built-in set above so the library opens populated. */
let TMPL_ID = 0;
const TASK_TEMPLATES = TEMPLATE_TASKS.map(t => ({
  id:'tt'+(++TMPL_ID),
  title:t.t, desc:t.desc, phase:t.ph, side:t.side,
  help:(t.help||[]).slice(), docs:(t.docs||[]).slice(),
  builtin:true
}));

/* ---------- v2: Phase Templates ----------
   A Phase Template is the list of phases and tasks that a given Product + Plan
   combination starts with. Creating a lab from a template copies these task
   templates in; picking "blank" copies nothing. */
let PTMPL_ID = 0;
const PHASE_TEMPLATES = [
  {id:'pt'+(++PTMPL_ID), name:'LIMS — Starter',       line:'LIMS',         tier:'Starter',
   phases:clonePhases(), phaseNames:{}, taskPhase:{}, taskIds:TASK_TEMPLATES.filter(t=>!/Metrc/i.test(t.title)).map(t=>t.id)},
  {id:'pt'+(++PTMPL_ID), name:'LIMS — Pro',           line:'LIMS',         tier:'Pro',
   phases:clonePhases(), phaseNames:{}, taskPhase:{}, taskIds:TASK_TEMPLATES.filter(t=>!/Metrc/i.test(t.title)).map(t=>t.id)},
  {id:'pt'+(++PTMPL_ID), name:'LIMS — Premium',       line:'LIMS',         tier:'Premium',
   phases:clonePhases(), phaseNames:{}, taskPhase:{}, taskIds:TASK_TEMPLATES.map(t=>t.id)},
  {id:'pt'+(++PTMPL_ID), name:'Network Only — Basic', line:'Network Only', tier:'Basic',
   phases:clonePhases(), phaseNames:{p3:'Data Handoff'}, taskPhase:{}, taskIds:TASK_TEMPLATES.filter(t=>t.phase!=='p3').map(t=>t.id)}
];
/* Every template carries the same v3 shape, including ones restored from an older
   saved payload that predates phases/taskPhase. */
function normalizeTemplate(p){
  if(!Array.isArray(p.phases) || !p.phases.length) p.phases = clonePhases();
  p.phases = p.phases.map((ph,i) => ({...ph, order:i+1, dueOffset: typeof ph.dueOffset==='number' ? ph.dueOffset : (i+1)*21}));
  if(!p.phaseNames || typeof p.phaseNames !== 'object') p.phaseNames = {};
  if(!p.taskPhase  || typeof p.taskPhase  !== 'object') p.taskPhase  = {};
  if(!Array.isArray(p.taskIds)) p.taskIds = [];
  return p;
}
PHASE_TEMPLATES.forEach(normalizeTemplate);

/* ---------- Lab (outline §6) — real lab names from the Notion hub ----------
   v2 adds abbrev / state (captured on the Create New Lab form) and users, which
   is what the per-task assignee picker offers on the lab side. */
const LABS = [
  {slug:'northgate-analytical', name:'Northgate Analytical',   abbrev:'NGA', state:'CO', line:'LIMS',         tier:'Pro',     am:'Elliot Reese',   start:'2026-07-14', done:8,  users:['Imani Breslow','Victor Amaya'], industries:['Cannabis','Hemp'], linearUrl:'https://linear.app/confident/project/northgate-analytical-onboarding'},
  {slug:'clearwater-testing',   name:'Clearwater Testing Co',  abbrev:'CWT', state:'MT', line:'LIMS',         tier:'Premium', am:'Elliot Reese',   start:'2026-06-02', done:15, users:['Rosa Lindholm','Teddy Varga'], industries:['Cannabis'], statusNote:'Waiting on a regulator response about the new matrix rule.', linearUrl:'https://linear.app/confident/project/clearwater-testing-onboarding'},
  {slug:'birchwood-labs',       name:'Birchwood Labs',         abbrev:'BWL', state:'MN', line:'LIMS',         tier:'Starter', am:'Elliot Reese',   start:'2026-08-19', done:3,  users:['Omar Castellanos','Hallie Pruitt']},
  {slug:'ridgeline-scientific', name:'Ridgeline Scientific',   abbrev:'RDG', state:'OR', line:'LIMS',         tier:'Pro',     am:'Elliot Reese',   start:'2026-05-11', done:11, users:['Sunil Oyelowo','Margot Feeney'], industries:['Cannabis','Environmental'], statusNote:'Quote needed for the custom importer on the legacy LC.'},
  {slug:'pacifica-analytical',  name:'Pacifica Analytical',    abbrev:'PCA', state:'CA', line:'LIMS',         tier:'Premium', am:'Dana Whitfield', start:'2026-07-28', done:9,  users:['Jonah Kittridge','Wen Arakawa']},
  {slug:'blue-heron-labs',      name:'Blue Heron Labs',        abbrev:'BHL', state:'MN', line:'Network Only', tier:'Pro',     am:'Dana Whitfield', start:'2026-08-04', done:6,  users:['Caleb Nwosu','Simone Darrow']},
  {slug:'prairie-state-testing',name:'Prairie State Testing',  abbrev:'PST', state:'MO', line:'LIMS',         tier:'Starter', am:'Dana Whitfield', start:'2026-08-25', done:2,  users:['Delia Marchetti','Roy Ellsworth']},
  {slug:'mesa-verde-labs',      name:'Mesa Verde Labs',        abbrev:'MVL', state:'NM', line:'Network Only', tier:'Basic',   am:'Marcus Oyelaran',start:'2026-06-16', done:12, users:['Alonso Rivera-Fay','Tess Buhler'], industries:['Food & Beverage'], statusNote:'No reply to the last three emails — chasing a new contact.'},
  {slug:'quarry-hill-diag',     name:'Quarry Hill Diagnostics',abbrev:'QHD', state:'MA', line:'LIMS',         tier:'Premium', am:'Marcus Oyelaran',start:'2026-04-20', done:17, users:['Ingrid Solano','Pete Varnavas']},
  {slug:'hudson-line-labs',     name:'Hudson Line Labs',       abbrev:'HLL', state:'NY', line:'Network Only', tier:'Premium', am:'Marcus Oyelaran',start:'2026-08-11', done:5,  users:['Micah Devereaux','Zoe Abara']},
  {slug:'great-lakes-assay',    name:'Great Lakes Assay',      abbrev:'GLA', state:'MI', line:'LIMS',         tier:'Pro',     am:'Dana Whitfield', start:'2026-07-07', done:10, users:['Fiona Tamblyn','Russ Okonkwo']},
  /* v2 seeds two finished labs so the Completed labs section on the dashboard has
     something to show. done is set past the task count, which marks every task done. */
  {slug:'cedar-fork-labs',      name:'Cedar Fork Labs',        abbrev:'CFL', state:'WA', line:'LIMS',         tier:'Starter', am:'Elliot Reese',   start:'2026-03-09', done:99, users:['Lena Hartigan','Sam Okoye'], industries:['Cannabis'], sentiment:'smooth'},
  {slug:'saltflat-analytics',   name:'Saltflat Analytics',     abbrev:'SFA', state:'AZ', line:'Network Only', tier:'Pro',     am:'Dana Whitfield', start:'2026-02-24', done:99, users:['Bea Fontaine','Curtis Mwangi']}
];

/* Every lab carries the same v2 config slots. Filling them here rather than in
   each literal keeps the seed rows readable and — more importantly — means labs
   restored from localStorage or created through the form get the same shape, so
   no renderer has to guard against a missing field. */
function normalizeLab(l){
  if(!Array.isArray(l.users))       l.users = [];
  if(!l.phaseNames || typeof l.phaseNames !== 'object') l.phaseNames = {};
  if(!Array.isArray(l.docBundle))   l.docBundle = [];
  if(typeof l.internalNotes !== 'string') l.internalNotes = '';
  if(typeof l.abbrev !== 'string')  l.abbrev = '';
  if(typeof l.state !== 'string')   l.state = '';
  /* v3. phases is the lab's own snapshot of whatever template built it — a later
     edit to that template must not reshape a live checklist, so the lab owns a copy.
     phaseDue holds per-lab date overrides on top of the snapshot's dueOffset. */
  if(!Array.isArray(l.phases) || !l.phases.length) l.phases = clonePhases();
  l.phases = l.phases.map((p,i) => ({...p, order:i+1, dueOffset: typeof p.dueOffset==='number' ? p.dueOffset : (i+1)*21}));
  if(!l.phaseDue || typeof l.phaseDue !== 'object') l.phaseDue = {};
  if(!Array.isArray(l.industries))  l.industries = [];
  if(typeof l.statusNote !== 'string')  l.statusNote = '';
  if(typeof l.linearUrl  !== 'string')  l.linearUrl  = '';
  if(typeof l.sentiment  !== 'string')  l.sentiment  = '';
  l.archived = !!l.archived;
  return l;
}

/* Resolve the phase list for one lab: its own snapshot, with any AM rename layered on.
   Falls back to the portal defaults for a lab object that has no snapshot yet (which is
   what a bare {} from a caller or an old saved payload looks like). */
function phasesFor(l){
  const over = (l && l.phaseNames) || {};
  const base = (l && Array.isArray(l.phases) && l.phases.length) ? l.phases : PHASES;
  return base.map((p,i) => ({...p, order:i+1, name: over[p.id] || p.name}));
}
function phaseOfLab(l, id){ return phasesFor(l).find(p => p.id === id); }

/* v3: phase due dates. The template's dueOffset is days from the lab's start date;
   an AM override in Lab settings wins over the computed date. Returns '' when the lab
   has no start date to count from, and every caller treats '' as "no date set". */
const addDays = (iso, days) => new Date(new Date(iso+'T12:00:00Z').getTime() + days*864e5).toISOString().slice(0,10);
function phaseDue(l, p){
  if(!l) return '';
  if(l.phaseDue && l.phaseDue[p.id]) return l.phaseDue[p.id];
  if(!l.start || typeof p.dueOffset !== 'number') return '';
  return addDays(l.start, p.dueOffset);
}
/* A phase is overdue when its date has passed and it still has unfinished work.
   v3 moved dates off individual tasks, so this is the only overdue signal there is. */
function phaseOverdue(l, p){
  const due = phaseDue(l, p);
  if(!due) return false;
  const ts = (TASKS[l.slug] || []).filter(t => t.phase === p.id);
  if(!ts.length || ts.every(isDone)) return false;
  return new Date(due+'T12:00:00Z') < TODAY;
}
const latePhases = l => phasesFor(l).filter(p => phaseOverdue(l, p));
const daysLate = due => Math.round((TODAY - new Date(due+'T12:00:00Z'))/864e5);

/* ---------- demo persistence ----------
   The real product keeps this server-side (outline §6). For the prototype we
   snapshot the mutable slice of the world into localStorage so a refresh does
   not wipe the walkthrough. Everything is wrapped: private-mode browsers and
   quota errors must degrade to in-memory, never to a broken page. */
/* v2 bumps the schema: labs are now mutable (the Create New Lab form pushes into
   LABS, Lab Settings edits them) so the lab list has to be saved too, otherwise a
   lab created in the demo disappears on the next refresh. Old v1 payloads are
   ignored rather than migrated — this is a prototype, and a clean reseed is a
   better failure mode than a half-converted one. */
const STORE_KEY = 'confident-onboarding-portal/v2';
function saveState(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      v:2, taskId:TASK_ID, tmplId:TMPL_ID, ptmplId:PTMPL_ID,
      tasks:TASKS, activity:ACTIVITY, labs:LABS,
      taskTemplates:TASK_TEMPLATES, phaseTemplates:PHASE_TEMPLATES,
      me:STATE.me,
      view:{role:STATE.role, labSlug:STATE.labSlug, amScope:STATE.amScope, amLab:STATE.amLab}
    }));
  }catch(e){ /* no-op: demo continues in memory */ }
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || d.v !== 2 || !d.tasks) return false;

    /* Labs first: everything below is keyed off the lab list, and a saved lab may
       not exist in the seed set at all now that labs can be created in-app. */
    if(Array.isArray(d.labs) && d.labs.length && d.labs.every(l => l && typeof l.slug === 'string')){
      LABS.length = 0;
      d.labs.forEach(l => LABS.push(normalizeLab(l)));
    }
    if(Array.isArray(d.taskTemplates) && d.taskTemplates.length){
      TASK_TEMPLATES.length = 0;
      d.taskTemplates.forEach(t => TASK_TEMPLATES.push(t));
    }
    if(Array.isArray(d.phaseTemplates) && d.phaseTemplates.length){
      PHASE_TEMPLATES.length = 0;
      d.phaseTemplates.forEach(t => PHASE_TEMPLATES.push(normalizeTemplate(t)));
    }
    if(typeof d.tmplId  === 'number') TMPL_ID  = Math.max(TMPL_ID,  d.tmplId);
    if(typeof d.ptmplId === 'number') PTMPL_ID = Math.max(PTMPL_ID, d.ptmplId);
    if(d.me && d.me.lab && d.me.am){
      if(typeof d.me.lab.name === 'string' && d.me.lab.name) STATE.me.lab.name = d.me.lab.name;
      if(typeof d.me.lab.role === 'string' && d.me.lab.role) STATE.me.lab.role = d.me.lab.role;
      if(typeof d.me.am.name  === 'string' && d.me.am.name){ STATE.me.am.name = d.me.am.name; STATE.currentUser = d.me.am.name; }
      if(typeof d.me.am.role  === 'string' && d.me.am.role)  STATE.me.am.role  = d.me.am.role;
    }

    /* Only adopt task lists for labs that exist, so editing seed data can never
       orphan saved state into an unrenderable shape. */
    let adopted = 0;
    LABS.forEach(l => {
      if(Array.isArray(d.tasks[l.slug])){ TASKS[l.slug] = d.tasks[l.slug]; adopted++; }
      else if(!TASKS[l.slug]){ TASKS[l.slug] = buildTasks(l); }
    });
    if(!adopted) return false;
    normalizeTasks();
    if(Array.isArray(d.activity)){ ACTIVITY.length = 0; d.activity.forEach(a => ACTIVITY.push(a)); }
    if(typeof d.taskId === 'number') TASK_ID = Math.max(TASK_ID, d.taskId);
    if(d.view){
      if(d.view.role === 'lab' || d.view.role === 'am') STATE.role = d.view.role;
      if(LABS.some(l => l.slug === d.view.labSlug)) STATE.labSlug = d.view.labSlug;
      if(d.view.amScope === 'mine' || d.view.amScope === 'all') STATE.amScope = d.view.amScope;
      if(d.view.amLab === null || LABS.some(l => l.slug === d.view.amLab)) STATE.amLab = d.view.amLab;
    }
    return true;
  }catch(e){ return false; }
}
function resetState(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  location.reload();
}

   phaseOverdue — so nothing asks a task whether it is late. */
/* Declared, not assigned to a const: the seed pass below runs before this point in
   the file and a const would still be in its temporal dead zone when it is called. */
function normTask(t){ if(!Array.isArray(t.linearUrls)) t.linearUrls = []; delete t.dueDate; return t; }
const initials = n => n.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

}

/* Which phases are collapsed, keyed by lab + phase so collapsing a phase on one
   lab does not collapse it on another. Kept out of STATE because it is view chrome,
   not data — losing it on refresh costs nothing. */
const COLLAPSED = {};
const ckey = (slug,pid) => slug+':'+pid;
function togglePhase(slug, pid){
  const k = ckey(slug,pid);
  COLLAPSED[k] = !COLLAPSED[k];
  /* Flip the attribute in place rather than re-rendering: collapsing is a pure
     view change, and a full re-render here would fight the user's scroll position. */
  const el = document.querySelector('[data-phase-key="'+k+'"]');
  if(el){
    el.setAttribute('data-collapsed', COLLAPSED[k] ? '1' : '0');
    const btn = el.querySelector('.phase-head');
    if(btn) btn.setAttribute('aria-expanded', COLLAPSED[k] ? 'false' : 'true');
  }
}

function renderTasks(slug, mode){
  const l = LABS.find(x=>x.slug===slug);
  const all = tasksFor(slug);
  return phasesFor(l).map(p => {
    const ts = all.filter(t=>t.phase===p.id);
    if(!ts.length) return '';
    const d = ts.filter(isDone).length;
    const k = ckey(slug,p.id), col = !!COLLAPSED[k];
    /* v3: the date and the overdue state live here, not on the task rows below. */
    const due = phaseDue(l, p), late = phaseOverdue(l, p);
    return `<div class="phase" data-phase-key="${esc(k)}" data-collapsed="${col?1:0}" data-late="${late?1:0}">
      <div class="phase-head" role="button" tabindex="0" aria-expanded="${col?'false':'true'}"
        onclick="togglePhase('${slug}','${p.id}')"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePhase('${slug}','${p.id}')}">
        <span class="phase-caret" aria-hidden="true">${ICON.caret}</span>
        <span class="phase-badge">Phase ${p.order}</span>
        <h3>${esc(p.name)}</h3>
        ${due ? `<span class="phase-due ${late?'late':''}">${late
            ? 'Due '+esc(due)+' · '+daysLate(due)+' days late'
            : 'Due '+esc(due)}</span>` : ''}
        ${late ? '<span class="chip chip-late">Overdue</span>' : ''}
        <div class="phase-meter">
          <div class="bar"><span style="width:${Math.round(d/ts.length*100)}%"></span></div>
          <span class="n">${d}/${ts.length}</span>
        </div>
      </div>
      ${ts.map(t=>renderTask(t,l,mode)).join('')}

  }).join('');
}

/* ---------- interactions ---------- */
/* render() repaints in place and holds the scroll position, because ticking a
   task off mid-list should not throw you back to the top. Navigation — a role
   change, a scope change, opening a lab — passes {top:true} on purpose. */
function render(opts){
  const y = window.scrollY;
  const el = document.getElementById('app');
  el.innerHTML = STATE.role==='lab' ? renderLab() : (STATE.amLab ? renderAmLab() : renderAmPortfolio());
  window.scrollTo({top: (opts && opts.top) ? 0 : y});
  saveState();
}
function setRole(r){
  STATE.role = r; STATE.amLab = null;
  document.getElementById('btnLab').setAttribute('aria-pressed', r==='lab');
  document.getElementById('btnAm').setAttribute('aria-pressed', r==='am');
  render({top:true});
}
function setScope(s){ STATE.amScope = s; render({top:true}); }
function openAmLab(slug){ STATE.amLab = slug; render({top:true}); }

function findTask(id){
  for(const s in TASKS){ const t = TASKS[s].find(x=>x.id===id); if(t) return {t, slug:s}; }
}
function toggle(id){
  const {t} = findTask(id);
  if(isDone(t)){ t.status='Not started'; t.completedAt=null; }
  else { t.status='Done'; t.completedAt=TODAY.toISOString().slice(0,10); }
  const open = document.querySelector('.task[data-open="1"]');
  const openId = open ? open.id : null;
  render();
  if(openId){ const e = document.getElementById(openId); if(e) e.setAttribute('data-open','1'); }
}
/* ---------- v3: task deletion ----------
   The rule, in one place so both the button and the handler read it the same way:
   an AM may delete any task; a lab may delete only the ones the lab itself raised. */
function canDeleteTask(t, mode){ return !!t && (mode==='am' || t.source==='lab-created'); }
/* The confirmation is built into the page rather than using window.confirm, which is
   suppressed in an embedded frame — there it returns false and the delete would simply
   never happen, with nothing on screen to say why. */
function openDeleteTask(id, mode){
  const found = findTask(id); if(!found) return;
  const {t} = found;
  if(!canDeleteTask(t, mode)) return;
  document.getElementById('modal').innerHTML = `
    <h2>Delete this task?</h2>
    <p>“${esc(t.title)}” will be removed from the checklist along with its comments. This cannot be undone.</p>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button type="button" class="btn-coral" onclick="deleteTask('${t.id}','${mode}')">Delete task</button>
    </div>`;
  document.getElementById('scrim').setAttribute('data-open','1');
}
function deleteTask(id, mode){
  const found = findTask(id); if(!found) return;
  const {t, slug} = found;
  if(!canDeleteTask(t, mode)) return;      /* belt and braces — the button is already hidden */
  closeModal();
  const l = LABS.find(x=>x.slug===slug);
  TASKS[slug] = TASKS[slug].filter(x => x.id !== id);
  ACTIVITY.unshift({kind:'deleted', lab:l?l.name:'',
    txt:`<b>${esc(mode==='lab' ? 'The lab' : STATE.currentUser)}</b> deleted “${esc(t.title)}”`, when:'just now'});
  render();
}

/* ---------- v3: Linear ticket links (Confident side only) ---------- */
/* ENG-4417 out of .../issue/ENG-4417/some-slug — falls back to the raw URL. */
function linearLabel(url){
  const m = String(url).match(/\/issue\/([A-Z0-9]+-\d+)/i);
  return m ? m[1] : String(url).replace(/^https?:\/\//,'').slice(0,48);
}
function addLinear(ev, id){
  ev.preventDefault();
  const input = ev.target.querySelector('input[name="url"]');
  const v = (input.value||'').trim(); if(!v) return;
  const {t} = findTask(id) || {};
  if(!t) return;
  if(!Array.isArray(t.linearUrls)) t.linearUrls = [];
  if(!t.linearUrls.includes(v)) t.linearUrls.push(v);
  input.value = '';
  render();
  const e = document.getElementById('task-'+id); if(e) e.setAttribute('data-open','1');
}

const slugify = s => s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

/* Instantiating a phase template mirrors buildTasks: same due-date spacing off the
   start date, and the template's help/docs are KEYS that have to be mapped through
   HELP/DOCS to become the objects the renderer expects. A blank template gives [] —
   a lab with no tasks yet, which the empty states already handle. */
/* v3: the template owns the phase list, and taskPhase records any task that was moved
   to a different phase within this template. Ordering follows the template's phases, and
   a task whose phase no longer exists in the template falls into the first phase rather
   than vanishing into a phase nothing renders. Dates are not set here any more — they
   belong to the phase. */
function templatePhaseOf(ptmpl, tt){
  const ids = ptmpl.phases.map(p=>p.id);
  const want = (ptmpl.taskPhase && ptmpl.taskPhase[tt.id]) || tt.phase;
  return ids.includes(want) ? want : ids[0];
}
function tasksFromTemplate(lab, ptmpl){
  if(!ptmpl) return [];
  normalizeTemplate(ptmpl);
  const order = ptmpl.phases.map(p=>p.id);
  const picked = ptmpl.taskIds
    .map(id => TASK_TEMPLATES.find(t => t.id === id))
    .filter(Boolean)
    .map(tt => ({tt, phase: templatePhaseOf(ptmpl, tt)}))
    .sort((a,b) => order.indexOf(a.phase) - order.indexOf(b.phase));
  return picked.map(({tt, phase},i)=>({
    id:'t'+(++TASK_ID),
    title:tt.title, desc:tt.desc, phase, ownerSide:tt.side,
    assignee: tt.side==='lab' ? lab.name+' team' : lab.am,
    status:'Not started',
    completedAt:null,
    source:'template', createdBy:'Phase template ('+ptmpl.name+')',
    order:i, help:(tt.help||[]).map(k=>HELP[k]).filter(Boolean),
    docs:(tt.docs||[]).map(k=>DOCS[k]).filter(Boolean),
    linearUrls:[], comments:[]
  }));
}

function submitLabSettings(ev, slug){
  ev.preventDefault();
  const l = LABS.find(x=>x.slug===slug);
  if(!l) return;
  const f = ev.target.elements;

  /* Blank means "use the default", so drop the key rather than storing an empty string —
     phasesFor only overrides on a truthy value and this keeps the saved state honest.
     Phase dates behave the same way: a blank clears the override back to the template's offset. */
  const names = {}, dues = {};
  (l.phases||[]).forEach(p => {
    const v = ((f['phase-'+p.id] || {}).value || '').trim();
    if(v && v !== p.name) names[p.id] = v;
    const d = ((f['due-'+p.id] || {}).value || '').trim();
    if(d) dues[p.id] = d;
  });
  l.phaseNames = names;
  l.phaseDue   = dues;

  l.industries = [...ev.target.querySelectorAll('input[name="industry"]:checked')].map(i=>i.value);
  l.statusNote = ((f.statusNote||{}).value || '').trim();
  l.linearUrl  = ((f.linearUrl ||{}).value || '').trim();

  /* Repeated same-named inputs come back as a RadioNodeList, a bare element, or nothing
     at all depending on how many there are. querySelectorAll is the same shape every time. */
  l.docBundle = [...ev.target.querySelectorAll('input[name="doc"]:checked')].map(i=>i.value);

  const before = (l.users||[]).slice();
  l.users = [...ev.target.querySelectorAll('input[name="user"]')]
    .map(i=>i.value.trim()).filter(Boolean)
    .filter((v,i,a)=>a.indexOf(v)===i);

  /* A removed user may still be holding tasks. Hand those back to the lab rather than
     leaving an assignee that no longer appears in any dropdown. */
  const gone = before.filter(u => !l.users.includes(u));
  if(gone.length){
    (TASKS[slug]||[]).forEach(t => { if(gone.includes(t.assignee)) t.assignee = l.name+' team'; });
  }

  closeModal(); render();
}

/* ---------- v2: template admin ----------
   Two stores, deliberately separate. A task template is one reusable piece of work and
   knows nothing about who gets it. A phase template is the answer to "what does a
   Network Only Basic lab actually have to do", so it names phases and picks task
   templates. New labs are built by pairing the two. Modals are not part of render(),
   so anything that mutates here saves and re-opens the list itself. */
function openTemplates(){
  const byPhase = p => TASK_TEMPLATES.filter(t => t.phase === p.id);
  document.getElementById('modal').innerHTML = `
    <div class="modal-wide">
      <h3>Templates</h3>
      <p class="muted" style="font-size:13px;margin-bottom:4px">
        Phase templates decide what a new lab starts with. Task templates are the pieces they draw from.
      </p>
      <div class="modal-scroll">
        <div class="subhead first">Phase templates</div>
        ${PHASE_TEMPLATES.map(p => {
          normalizeTemplate(p);
          const nph = p.phases.length;
          return `<div class="tmplcard">
            <div>
              <b>${esc(p.name)}</b>
              <div class="muted" style="font-size:12px">
                ${esc(p.line)} · ${esc(p.tier)} · ${nph} phase${nph===1?'':'s'} · ${p.taskIds.length} task${p.taskIds.length===1?'':'s'}
              </div>
            </div>
            <button class="btn-ghost" onclick="openPhaseTemplate('${p.id}')">Edit</button>
          </div>`;
        }).join('')}
        <button class="btn-ghost" style="margin-top:8px" onclick="openPhaseTemplate('')">+ New phase template</button>

        <div class="subhead">Task templates</div>
        ${PHASES.map(p => `
          <div class="overline" style="margin:14px 0 6px">${esc(p.name)}</div>
          ${byPhase(p).length ? byPhase(p).map(t => `
            <div class="tmplcard">
              <div>
                <b>${esc(t.title)}</b>
                <div class="muted" style="font-size:12px">
                  ${t.side === 'lab' ? 'Lab' : 'Confident'}${t.builtin ? ' · built in' : ''}
                </div>
              </div>
              <button class="btn-ghost" onclick="openTaskTemplate('${t.id}')">Edit</button>
            </div>`).join('')
            : '<div class="emptyhint">No task templates in this phase yet.</div>'}
        `).join('')}
        <button class="btn-ghost" style="margin-top:12px" onclick="openTaskTemplate('')">+ New task template</button>
      </div>
      <div class="modal-actions">
        <button class="btn-blue" onclick="closeModal()">Done</button>
      </div>
    </div>`;
  document.getElementById('scrim').setAttribute('data-open','1');
}

function openTaskTemplate(id){
  const t = TASK_TEMPLATES.find(x => x.id === id);
  document.getElementById('modal').innerHTML = `
    <form onsubmit="submitTaskTemplate(event, '${id}')">
      <h3>${t ? 'Edit task template' : 'New task template'}</h3>
      <div class="field">
        <label class="overline" for="tt-title">Title</label>
        <input id="tt-title" name="title" required value="${t ? esc(t.title) : ''}" placeholder="Upload your method list">
      </div>
      <div class="field">
        <label class="overline" for="tt-desc">What this asks for</label>
        <textarea id="tt-desc" name="desc" rows="3" placeholder="One or two sentences the lab will actually read.">${t ? esc(t.desc) : ''}</textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="overline" for="tt-phase">Phase</label>
          <select id="tt-phase" name="phase">
            ${PHASES.map(p => `<option value="${p.id}" ${t && t.phase===p.id ? 'selected':''}>${esc(p.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label class="overline" for="tt-side">Owner</label>
          <select id="tt-side" name="side">
            <option value="lab" ${t && t.side==='lab' ? 'selected':''}>Lab</option>
            <option value="confident" ${t && t.side==='confident' ? 'selected':''}>Confident</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        ${t ? `<button type="button" class="btn-ghost" style="color:var(--coral)" onclick="deleteTaskTemplate('${t.id}')">Delete this template</button>` : ''}
        <button type="button" class="btn-ghost" onclick="openTemplates()">Back</button>
        <button type="submit" class="btn-blue">${t ? 'Save' : 'Create'}</button>
      </div>
    </form>`;
  document.getElementById('scrim').setAttribute('data-open','1');
}

function submitTaskTemplate(ev, id){
  ev.preventDefault();
  const f = ev.target.elements;
  const patch = {
    title:f.title.value.trim(), desc:f.desc.value.trim(),
    phase:f.phase.value, side:f.side.value
  };
  const existing = TASK_TEMPLATES.find(x => x.id === id);
  if(existing) Object.assign(existing, patch);
  else TASK_TEMPLATES.push({id:'tt'+(++TMPL_ID), help:[], docs:[], builtin:false, ...patch});
  saveState();
  openTemplates();
}

function deleteTaskTemplate(id){
  const i = TASK_TEMPLATES.findIndex(x => x.id === id);
  if(i < 0) return;
  TASK_TEMPLATES.splice(i,1);
  /* A phase template still holding this id would silently build one task short with no
     clue why, so drop the reference everywhere it appears. */
  PHASE_TEMPLATES.forEach(p => { p.taskIds = p.taskIds.filter(x => x !== id); });
  saveState();
  openTemplates();
}

/* v3: adding or removing a phase changes which phases every task row can be moved to,
   so those two actions re-open the modal from a draft read straight out of the form
   rather than patching the DOM in place and letting the selects go stale. */
let PH_ID = 100;
function readPhaseTemplateForm(){
  const form = document.getElementById('modal').querySelector('form');
  if(!form) return null;
  const f = form.elements;
  const phases = [...form.querySelectorAll('.phrow')].map((row,i) => ({
    id: row.dataset.pid,
    name: (row.querySelector('[data-k="name"]').value || '').trim() || ('Phase '+(i+1)),
    blurb: row.dataset.blurb || '',
    order: i+1,
    dueOffset: Number(row.querySelector('[data-k="off"]').value) || 0
  }));
  const taskPhase = {};
  [...form.querySelectorAll('select[data-tt]')].forEach(sel => { taskPhase[sel.dataset.tt] = sel.value; });
  return {
    name:(f.name.value||'').trim(), line:f.line.value, tier:f.tier.value,
    phases, taskPhase,
    taskIds:[...form.querySelectorAll('input[name="task"]:checked')].map(i=>i.value)
  };
}
function addTemplatePhase(id){
  const d = readPhaseTemplateForm(); if(!d) return;
  d.phases.push({id:'px'+(++PH_ID), name:'New phase', blurb:'', order:d.phases.length+1, dueOffset:(d.phases.length+1)*21});
  openPhaseTemplate(id, d);
}
function removeTemplatePhase(id, pid){
  const d = readPhaseTemplateForm(); if(!d) return;
  if(d.phases.length <= 1) return;
  /* A phase cannot take its tasks down with it. Everything selected in this phase has
     to be moved somewhere else first — which is what the per-task Phase picker is for. */
  const held = d.taskIds.filter(tid => d.taskPhase[tid] === pid);
  if(held.length){
    const err = document.getElementById('pterr');
    if(err) err.textContent = held.length+' task'+(held.length>1?'s are':' is')+' still in that phase. Move them to another phase first.';
    return;
  }
  d.phases = d.phases.filter(p => p.id !== pid);
  openPhaseTemplate(id, d);
}

function openPhaseTemplate(id, draft){
  const p = PHASE_TEMPLATES.find(x => x.id === id);
  if(p) normalizeTemplate(p);
  const d = draft || (p
    ? {name:p.name, line:p.line, tier:p.tier, phases:p.phases.map(x=>({...x})),
       taskPhase:{...p.taskPhase}, taskIds:p.taskIds.slice()}
    : {name:'', line:'LIMS', tier:'Starter', phases:clonePhases(), taskPhase:{}, taskIds:[]});
  const picked = d.taskIds;
  const over = (p && p.phaseNames) || {};
  const phaseOfTT = tt => {
    const want = d.taskPhase[tt.id] || tt.phase;
    return d.phases.some(x=>x.id===want) ? want : d.phases[0].id;
  };
  document.getElementById('modal').innerHTML = `
    <form class="modal-wide" onsubmit="submitPhaseTemplate(event, '${id}')">
      <h3>${p ? 'Edit phase template' : 'New phase template'}</h3>
      <div class="modal-scroll">
        <div class="field">
          <label class="overline" for="pt-name">Template name</label>
          <input id="pt-name" name="name" required value="${esc(d.name)}" placeholder="LIMS — Pro">
        </div>
        <div class="field-row">
          <div class="field">
            <label class="overline" for="pt-line">Product</label>
            <select id="pt-line" name="line">
              <option value="LIMS" ${d.line==='LIMS' ? 'selected':''}>LIMS</option>
              <option value="Network Only" ${d.line==='Network Only' ? 'selected':''}>Network Only</option>
            </select>
          </div>
          <div class="field">
            <label class="overline" for="pt-tier">Plan</label>
            <select id="pt-tier" name="tier">
              ${['Starter','Pro','Premium','Basic'].map(x =>
                `<option value="${x}" ${d.tier===x ? 'selected':''}>${x}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="subhead">Phases</div>
        <p class="muted" style="font-size:12.5px;margin-bottom:10px">
          A lab built from this template takes its own copy of these phases, so editing them
          here never reshapes a lab that already exists. <b>Due in</b> is days from the lab's
          start date; an account manager can override any date per lab in Lab settings.</p>
        <div id="phrows">
          ${d.phases.map((ph,i) => `
            <div class="phrow" data-pid="${esc(ph.id)}" data-blurb="${esc(ph.blurb||'')}">
              <span class="phnum">${i+1}</span>
              <input data-k="name" value="${esc(ph.name)}" placeholder="Phase name" aria-label="Phase ${i+1} name">
              <label class="offlab">Due in
                <input data-k="off" type="number" min="0" max="999" value="${Number(ph.dueOffset)||0}" aria-label="Phase ${i+1} due offset in days">
                days</label>
              <button type="button" class="xbtn" onclick="removeTemplatePhase('${id}','${esc(ph.id)}')"
                aria-label="Remove phase" ${d.phases.length<=1?'disabled':''}>&times;</button>
            </div>`).join('')}
        </div>
        <button type="button" class="btn-ghost" style="margin-top:8px" onclick="addTemplatePhase('${id}')">+ Add phase</button>
        <span class="savedflag" id="pterr"></span>

        <div class="subhead">Tasks in this template</div>
        <p class="muted" style="font-size:12.5px;margin-bottom:10px">
          Tick what this template starts a lab with. Use the phase picker on a row to move
          a task into a different phase for this template only.</p>
        ${d.phases.map(ph => {
          const rows = TASK_TEMPLATES.filter(t => phaseOfTT(t) === ph.id);
          return `<div class="overline" style="margin:14px 0 6px">${esc(ph.name)}</div>
          ${rows.length ? rows.map(t => `
            <div class="rowitem taskrow">
              <label class="taskpick">
                <input type="checkbox" name="task" value="${t.id}" ${picked.includes(t.id) ? 'checked':''}>
                <span>${esc(t.title)} <span class="muted">· ${t.side === 'lab' ? 'Lab' : 'Confident'}</span></span>
              </label>
              <select data-tt="${t.id}" aria-label="Phase for ${esc(t.title)}">
                ${d.phases.map(x=>`<option value="${esc(x.id)}"${x.id===ph.id?' selected':''}>${esc(x.name)}</option>`).join('')}
              </select>
            </div>`).join('')
            : '<div class="emptyhint">No task templates in this phase yet.</div>'}`;
        }).join('')}
      </div>
      <div class="modal-actions">
        ${p ? `<button type="button" class="btn-ghost" style="color:var(--coral)" onclick="deletePhaseTemplate('${p.id}')">Delete this template</button>` : ''}
        <button type="button" class="btn-ghost" onclick="openTemplates()">Back</button>
        <button type="submit" class="btn-blue">${p ? 'Save' : 'Create'}</button>
      </div>
    </form>`;
  document.getElementById('scrim').setAttribute('data-open','1');
}

function submitPhaseTemplate(ev, id){
  ev.preventDefault();
  const d = readPhaseTemplateForm();
  if(!d) return;
  /* Phase names now live on the phase rows themselves, so phaseNames keeps only what a
     lab-level rename would need and is no longer the place the template stores its names. */
  const patch = {
    name:d.name, line:d.line, tier:d.tier,
    phases:d.phases, taskPhase:d.taskPhase, phaseNames:{},
    taskIds:d.taskIds
  };
  const existing = PHASE_TEMPLATES.find(x => x.id === id);
  if(existing) Object.assign(existing, normalizeTemplate(patch));
  else PHASE_TEMPLATES.push(normalizeTemplate({id:'pt'+(++PTMPL_ID), ...patch}));
  saveState();
  openTemplates();
}

function deletePhaseTemplate(id){
  const i = PHASE_TEMPLATES.findIndex(x => x.id === id);
  if(i < 0) return;
  /* Safe to remove outright: building a lab copies tasks rather than linking to them,
     so no existing lab points back at this template. */
  PHASE_TEMPLATES.splice(i,1);
  saveState();
  openTemplates();
}

/* ---------- boot ---------- */
loadState();
document.getElementById('btnLab').setAttribute('aria-pressed', STATE.role==='lab');
document.getElementById('btnAm').setAttribute('aria-pressed', STATE.role==='am');
render({top:true});
</script>
</body>
</html>
